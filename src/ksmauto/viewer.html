<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one screen — chart card on top, playfield in the middle, transport below. A night arcade cabinet, dark only. */
:root {
  --bg: #0b0d16; --panel: #141828; --line: #2a3150; --fg: #e8ecf8; --muted: #8b93b3;
  --bt: #f4f6ff; --fx: #ff9a2e; --laser-l: #2fd3ff; --laser-r: #ff4fb8; --accent: #b9a2ff;
  --display: "Chakra Petch", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
.open { font-size: .8rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px; }
.open input { max-width: 100%; }
body.dragging .open { border-color: var(--accent); }
#open-status { display: block; overflow-wrap: anywhere; }
#jdg3d { position: absolute; inset: 0; pointer-events: none; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; display: flex; justify-content: center;
}
.app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; min-height: 0; height: 100%; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: end; }
.card h1 { margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.3; text-wrap: balance; min-width: 0; }
.card .artist { color: var(--muted); font-size: .85rem; grid-column: 1; }
.diff { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); text-align: right; line-height: 1; }
.diff .name { font-size: .75rem; letter-spacing: .14em; color: var(--accent); }
.diff .level { font-size: 2.1rem; font-weight: 700; }
.stage { position: relative; flex: 1 1 auto; min-height: 280px; border-radius: 10px; overflow: hidden; background: #070810; border: 1px solid var(--line); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#field3d { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 15%, #1d2140, #070810 70%); }
.hud { position: absolute; inset: 8px 10px auto; display: flex; justify-content: space-between; font-family: var(--display); font-size: .8rem; color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
.hud b { color: var(--fg); font-weight: 700; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #070810b0; }
.overlay button { font-size: 1.05rem; padding: 14px 28px; }
.transport { display: grid; gap: 8px; }
.seek { position: relative; height: 26px; }
.seek input { width: 100%; margin: 0; position: absolute; inset: 0; height: 26px; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.marks span { position: absolute; top: 0; height: 6px; width: 1px; background: var(--accent); }
.marks em { position: absolute; top: 18px; font-size: .62rem; font-style: normal; color: var(--muted); transform: translateX(-2px); white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .85rem; color: var(--muted); }
.row label { display: flex; align-items: center; gap: 6px; }
button, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: #12101e; border-color: var(--accent); font-weight: 700; font-family: var(--display); letter-spacing: .06em; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { accent-color: var(--accent); }
.time { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--fg); margin-left: auto; }
.note { font-size: .72rem; color: var(--muted); margin: 0; }
</style>

<div class="app">
  <div class="open" id="open">
    <label>譜面・音源を開く <input id="files" type="file" multiple accept=".kson,.ksh,.mp3,.ogg,.wav,.m4a,.flac,.opus,.aac"></label>
    <span id="open-status" role="status">KSON / KSH と音源を選択、またはファイル・フォルダーをドロップ</span>
  </div>
  <header class="card">
    <h1 id="title"></h1>
    <div class="diff"><div class="name" id="diffname"></div><div class="level" id="level"></div></div>
    <div class="artist" id="artist"></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="field" aria-label="Chart playfield"></canvas>
    <canvas id="field3d" aria-label="Chart playfield (3D)" hidden></canvas>
    <canvas id="jdg3d" aria-label="Judgment line and laser cursors"></canvas>
    <div class="hud"><span>BPM <b id="bpm">-</b></span><span>m<b id="measure">0</b></span><span>NOTES <b id="total">0</b></span></div>
    <div class="overlay" id="overlay"><button class="primary" id="start">▶ PLAY</button></div>
  </div>
  <div class="transport">
    <div class="seek"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek"><div class="marks" id="marks"></div></div>
    <div class="row">
      <button id="play" class="primary">▶ PLAY</button>
      <button id="back" title="4 measures back">−4</button>
      <label>表示 <select id="view"><option value="3d" selected>KSM 風（3D）</option><option value="flat">平面</option></select></label>
      <label>HI-SPEED <input id="hispeed" type="range" min="3" max="12" step="0.5" value="6.5"></label>
      <label>速度 <select id="rate"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1.0×</option></select></label>
      <label><input id="assist" type="checkbox"> アシスト音</label>
      <label title="レーザー直角のキー音（合成音）"><input id="slam" type="checkbox" checked> 直角音</label>
      <label title="FX ロング・レーザーのエフェクトと FX のキー音（全部押した場合の近似）"><input id="effects" type="checkbox"> エフェクト</label>
      <label>表示タイミング <input id="vis" type="range" min="-200" max="200" step="5" value="0"> <output id="vis-out">0ms</output></label>
      <span id="latency"></span>
      <span class="time" id="time">0:00</span>
    </div>
    <p class="note" id="srcnote"></p>
    <p class="note">ズレて見えるとき: アシスト音をオンにして、曲と音が合っていれば譜面は正しく、画面の遅れです。「表示タイミング」で合わせてください（+ にするとノーツが遅れて流れます）。</p>
  </div>
</div>
<audio id="audio" preload="auto"></audio>

<script id="fx-worklet" type="text/plain">
// Audio effects of FX longs and lasers, written from the KSON spec (docs/spec/kson_format.md).
// Loaded as an AudioWorklet module; the page sends the effect timeline once and its clock every frame.
// Lengths arrive as measures (>= 0) or as negative seconds.
const TAU = 2 * Math.PI;
class Biquad {
  constructor() { this.c = [1, 0, 0, 0, 0]; this.z = [0, 0, 0, 0]; }
  set(type, f, q, db = 0) {
    const w = TAU * Math.min(Math.max(f, 10), sampleRate * 0.45) / sampleRate, cs = Math.cos(w), al = Math.sin(w) / (2 * q), A = Math.pow(10, db / 40);
    let b0, b1, b2, a0, a2;
    if (type === 'lp') { b0 = b2 = (1 - cs) / 2; b1 = 1 - cs; a0 = 1 + al; a2 = 1 - al; }
    else if (type === 'hp') { b0 = b2 = (1 + cs) / 2; b1 = -(1 + cs); a0 = 1 + al; a2 = 1 - al; }
    else { b0 = 1 + al * A; b1 = -2 * cs; b2 = 1 - al * A; a0 = 1 + al / A; a2 = 1 - al / A; }
    this.c = [b0 / a0, b1 / a0, b2 / a0, -2 * cs / a0, a2 / a0];
  }
  run(x, ch) { const c = this.c, z = this.z, k = ch * 2, y = c[0] * x + z[k]; z[k] = c[1] * x - c[3] * y + z[k + 1]; z[k + 1] = c[2] * x - c[4] * y; return y; }
}
// Each effect reads its parameters once per block (OnMin..OnMax by the laser value v; FX longs use v = 0)
// and then turns one stereo sample into this.l / this.r.
class Fx {
  constructor(seg) { this.p = seg.p; this.l = this.r = 0; }
  get(k, v) { const q = this.p[k]; return q ? q.min + (q.max - q.min) * v : 0; }
  wet(l, r, wl, wr, mix) { this.l = l + (wl - l) * mix; this.r = r + (wr - r) * mix; }
}
class Gate extends Fx {
  g = 1;
  block(e) { this.wl = e.len(this.get('wave_length', e.v)); this.rate = this.get('rate', e.v); this.mix = this.get('mix', e.v); this.ms = e.ms; }
  step(l, r, t) {
    const on = !(this.wl > 0) || (t - this.ms) % this.wl < this.rate * this.wl;
    this.g += ((on ? 1 : 0) - this.g) * 0.05;
    const k = 1 - this.mix + this.mix * this.g; this.l = l * k; this.r = r * k;
  }
}
// retrigger and echo: record from the trigger point and loop the first wave_length of it. Periods
// count from the measure start, so a note that starts mid-period plays through until the next one.
class Repeat extends Fx {
  buf = [new Float32Array(sampleRate * 4), new Float32Array(sampleRate * 4)]; key = null; n = 0; k = 0; period = null; t0 = 0;
  block(e) {
    this.wl = e.len(this.get('wave_length', e.v)); this.upd = e.len(this.get('update_period', e.v)); this.mix = this.get('mix', e.v);
    this.echo = 'feedback_level' in this.p; this.rate = this.echo ? 1 : this.get('rate', e.v); this.fb = this.get('feedback_level', e.v);
    this.ms = e.ms; this.spc = e.spc;
  }
  step(l, r, t) {
    if (!(this.wl > 0)) { this.l = l; this.r = r; return; }
    const key = this.upd > 0 ? this.ms + Math.floor((t - this.ms) / this.upd + 1e-9) * this.upd : 0;
    const period = this.ms + Math.floor((t - this.ms) / this.wl + 1e-9) * this.wl;
    if (key !== this.key || t < this.t0) { this.key = key; this.t0 = t; this.n = 0; this.k = 0; this.period = period; }
    if (period !== this.period) { this.period = period; this.k++; }
    const cap = Math.min(this.buf[0].length, Math.max(1, Math.round(this.wl * this.spc)));
    if (this.n < cap) { this.buf[0][this.n] = l; this.buf[1][this.n] = r; this.n++; }
    const ph = Math.max(0, t - period), pos = Math.floor(ph * this.spc);   // the 1e-9 snap can put t a hair before its period
    if (this.k === 0 || pos >= this.n) { this.l = l; this.r = r; return; }   // still recording the source
    const g = this.echo ? Math.pow(this.fb, this.k) : ph < this.rate * this.wl ? 1 : 0;

}
class Bitcrusher extends Fx {
  c = 0; hl = 0; hr = 0;
  block(e) { this.n = this.get('reduction', e.v) * sampleRate / 44100; this.mix = this.get('mix', e.v); }
  step(l, r) { if (++this.c >= this.n) { this.c = 0; this.hl = l; this.hr = r; } this.wet(l, r, this.hl, this.hr, this.mix); }
}
class Flanger extends Fx {
  d = [new Float32Array(8192), new Float32Array(8192)]; w = 0;
  block(e) {
    this.per = e.len(this.get('period', e.v)); this.dl = this.get('delay', e.v) * sampleRate / 44100; this.dp = this.get('depth', e.v) * sampleRate / 44100;
    this.fb = this.get('feedback', e.v); this.sw = this.get('stereo_width', e.v); this.vol = 'vol' in this.p ? this.get('vol', e.v) : 0.75; this.mix = this.get('mix', e.v);
  }
  tap(ch, x, t, off) {
    const lfo = this.per > 0 ? 0.5 - 0.5 * Math.cos(TAU * (t / this.per + off)) : 0.5, buf = this.d[ch];
    const p = this.w - this.dl - this.dp * lfo, i = Math.floor(p), f = p - i, y = buf[i & 8191] * (1 - f) + buf[(i + 1) & 8191] * f;
    buf[this.w & 8191] = x + y * this.fb;
    return (x + y * this.vol) / (1 + this.vol);
  }
  step(l, r, t) { const wl = this.tap(0, l, t, 0), wr = this.tap(1, r, t, this.sw / 2); this.w++; this.wet(l, r, wl, wr, this.mix); }
}
class Phaser extends Fx {
  z = new Float32Array(24); last = [0, 0]; a = [0, 0];
  block(e) {
    const per = e.len(this.get('period', e.v)), f1 = this.get('freq_1', e.v), f2 = this.get('freq_2', e.v), sw = this.get('stereo_width', e.v);
    this.n = Math.min(12, Math.round(this.get('stage', e.v))); this.fb = this.get('feedback', e.v); this.mix = Math.min(1, 2 * this.get('mix', e.v));
    for (let ch = 0; ch < 2; ch++) {
      const lfo = per > 0 ? 0.5 - 0.5 * Math.cos(TAU * (e.t / per + ch * sw / 2)) : 0.5;
      const tn = Math.tan(Math.PI * Math.min(f1 * Math.pow(f2 / f1, lfo), sampleRate * 0.45) / sampleRate);
      this.a[ch] = (tn - 1) / (tn + 1);

  }
  ap(ch, x) {
    let y = x + this.last[ch] * this.fb; const a = this.a[ch];
    for (let s = 0; s < this.n; s++) { const k = ch * 12 + s, o = a * y + this.z[k]; this.z[k] = y - a * o; y = o; }
    return this.last[ch] = y;
  }
  step(l, r) { const al = this.ap(0, l), ar = this.ap(1, r); this.l = l * (1 - this.mix / 2) + al * this.mix / 2; this.r = r * (1 - this.mix / 2) + ar * this.mix / 2; }
}
class Wobble extends Fx {
  f = new Biquad();
  block(e) {
    const wl = e.len(this.get('wave_length', e.v)); this.mix = wl > 0 ? this.get('mix', e.v) : 0;
    if (!(wl > 0)) return;
    const lfo = 0.5 - 0.5 * Math.cos(TAU * ((e.t - e.ms) % wl) / wl), f1 = this.get('freq_1', e.v), f2 = this.get('freq_2', e.v);
    this.f.set('lp', f1 * Math.pow(f2 / f1, lfo), this.get('q', e.v));
  }
  step(l, r) { this.wet(l, r, this.f.run(l, 0), this.f.run(r, 1), this.mix); }
}
// Slows the recorded audio from the note start down to a stop.
class Tapestop extends Fx {
  buf = [new Float32Array(sampleRate * 8), new Float32Array(sampleRate * 8)]; w = 0; rp = 0; sp = 1;
  block(e) { this.mix = this.get('trigger', e.v) > 0.5 ? this.get('mix', e.v) : 0; this.fall = Math.max(0.05, this.get('speed', e.v)) / (0.3 * sampleRate); }
  step(l, r) {
    if (this.w < this.buf[0].length) { this.buf[0][this.w] = l; this.buf[1][this.w] = r; this.w++; }
    this.sp = Math.max(0, this.sp - this.fall); this.rp = Math.min(this.rp + this.sp, this.w - 1);
    const i = Math.floor(this.rp), f = this.rp - i, j = Math.min(i + 1, this.w - 1), g = Math.min(1, this.sp * 4);
    this.wet(l, r, (this.buf[0][i] * (1 - f) + this.buf[0][j] * f) * g, (this.buf[1][i] * (1 - f) + this.buf[1][j] * f) * g, this.mix);
  }
}
class Sidechain extends Fx {
  block(e) {
    this.per = e.len(this.get('period', e.v)); this.a = e.len(this.get('attack_time', e.v)); this.h = e.len(this.get('hold_time', e.v));
    this.rl = e.len(this.get('release_time', e.v)); this.lo = 1 / Math.max(1, this.get('ratio', e.v)); this.ms = e.ms;
  }
  step(l, r, t) {
    let g = 1;
    if (this.per > 0) {
      const ph = (t - this.ms) % this.per, lo = this.lo;
      if (ph < this.a) g = 1 + (lo - 1) * ph / this.a;
      else if (ph < this.a + this.h) g = lo;
      else if (ph < this.a + this.h + this.rl) g = lo + (1 - lo) * (ph - this.a - this.h) / this.rl;
    }

  }
}
// Two crossfaded read heads sliding through a delay line.
class PitchShift extends Fx {
  d = [new Float32Array(16384), new Float32Array(16384)]; w = 0; ph = 0;
  block(e) { this.ratio = Math.pow(2, this.get('pitch', e.v) / 12); this.W = Math.min(8000, Math.max(64, this.get('chunk_size', e.v) * sampleRate / 44100)); this.mix = this.get('mix', e.v); }
  read(buf, d) { const p = this.w - d, i = Math.floor(p), f = p - i; return buf[i & 16383] * (1 - f) + buf[(i + 1) & 16383] * f; }
  step(l, r) {
    this.d[0][this.w & 16383] = l; this.d[1][this.w & 16383] = r;
    this.ph = (this.ph + (1 - this.ratio) / this.W + 1) % 1;
    const p2 = (this.ph + 0.5) % 1, g1 = 1 - Math.abs(2 * this.ph - 1), d1 = this.ph * this.W + 1, d2 = p2 * this.W + 1;
    this.wet(l, r, this.read(this.d[0], d1) * g1 + this.read(this.d[0], d2) * (1 - g1), this.read(this.d[1], d1) * g1 + this.read(this.d[1], d2) * (1 - g1), this.mix);

}
// Laser filters: v sweeps the cutoff on a log scale.
class Filter extends Fx {
  f = new Biquad();
  block(e) {
    const v = this.get('v', e.v); this.mix = this.get('mix', e.v); this.k = 1;
    if (this.type === 'peak') {
      const db = 15 * this.get('gain', e.v) / 0.5 * Math.min(1, v / 0.15) * (1 - 0.45 * Math.max(0, v - 0.15) / 0.85);
      this.f.set('peak', 50 * Math.pow(180, v), 1.2, db); this.k = 1 / (1 + db / 24);
    } else if (this.type === 'hp') this.f.set('hp', 100 * Math.pow(22, v), 'q' in this.p ? this.get('q', e.v) : 2);

  }
  step(l, r) { this.wet(l, r, this.f.run(l, 0) * this.k, this.f.run(r, 1) * this.k, this.mix); }

const filter = type => class extends Filter { type = type; };
const EFFECTS = {
  retrigger: Repeat, echo: Repeat, gate: Gate, flanger: Flanger, pitch_shift: PitchShift, bitcrusher: Bitcrusher, phaser: Phaser,
  wobble: Wobble, tapestop: Tapestop, sidechain: Sidechain,
  peaking_filter: filter('peak'), high_pass_filter: filter('hp'), low_pass_filter: filter('lp'),

const last = (list, t) => { let x = null; for (const e of list) { if (e[0] > t) break; x = e; } return x; };

class KsmEffects extends AudioWorkletProcessor {
  constructor() {
    super(); this.data = null; this.clock = null; this.reset();
    this.port.onmessage = e => {
      if (e.data.type === 'data') this.data = e.data;
      else if (e.data.type === 'reset') this.reset();   // seek: recordings and delay lines belong to the old position
      else this.clock = e.data;

  }
  reset() { this.stages = [{amt: 0}, {amt: 0}, {amt: 0, v: 0}]; }
  // One effect slot: a new segment gets a fresh effect; a finished one fades out before it is dropped.
  stage(s, seg, active, env) {
    if (seg && seg !== s.seg && EFFECTS[seg.type]) { s.seg = seg; s.fx = new EFFECTS[seg.type](seg); }
    s.target = active && seg === s.seg ? 1 : 0;
    if (!s.fx || (!s.target && s.amt < 1e-4)) { s.amt = 0; return null; }
    s.fx.block(env); return s;
  }
  laserValue(t) {
    let v = -1;
    for (const l of this.data.lasers) {
      const p = l.pts; if (t < p[0].t || t > p[p.length - 1].t + 0.05) continue;
      let x = p[p.length - 1].b;
      for (let i = 0; i + 1 < p.length; i++) if (p[i].t <= t && t < p[i + 1].t) { x = p[i].b + (p[i + 1].a - p[i].b) * (t - p[i].t) / (p[i + 1].t - p[i].t); break; }
      v = Math.max(v, l.side ? 1 - x : x);
    }
    return v;
  }
  process(inputs, outputs) {
    const inp = inputs[0], out = outputs[0], n = out[0].length, c = this.clock, d = this.data;
    const L = inp[0], R = inp[1] || inp[0];
    if (!L) { out.forEach(ch => ch.fill(0)); return true; }
    if (!d || !c || !c.on) { out[0].set(L); out[1].set(R); this.reset(); return true; }
    const t0 = c.chart + (currentTime - c.ctx) * c.rate, dt = c.rate / sampleRate;
    const bpm = last(d.bpms, t0)?.[1] || d.bpms[0][1], ms = last(d.measures, t0)?.[0] ?? 0;
    const env = {t: t0, ms, v: 0, spc: sampleRate / c.rate, len: x => x >= 0 ? x * 240 / bpm : -x};
    const active = [];
    for (let lane = 0; lane < 2; lane++) {
      const seg = d.fx[lane].find(s => s.t0 <= t0 && t0 < s.t1) || null;
      const s = this.stage(this.stages[lane], seg, !!seg, env); if (s) active.push(s);
    }
    const lv = this.laserValue(t0), ls = this.stages[2];
    if (lv >= 0) ls.v += (lv - ls.v) * 0.3;
    const s = this.stage(ls, last(d.laserFx, t0)?.[1] || null, lv >= 0, {...env, v: ls.v}); if (s) active.push(s);
    for (let i = 0; i < n; i++) {
