[project]
name = "ksmauto"
version = "0.1.0"
description = "Tools for authoring K-Shoot MANIA charts (KSON) with LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.26", "scipy>=1.11", "librosa>=0.10", "soundfile>=0.12"]
render = ["pillow>=10"]
stems = ["demucs>=4"]
transcribe = ["piano-transcription-inference>=0.0.6", "audioread>=3"]  # imported by the package, not declared by it

[project.scripts]
ksmauto = "ksmauto.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksmauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
